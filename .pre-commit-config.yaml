repos:
  - repo: local
    hooks:
      - id: gdformat-check
        name: gdformat --check
        entry: bash -c "gdformat --check ."
        language: script
        pass_filenames: false
      - id: gdlint-check
        name: gdlint
        entry: bash -c "gdlint ."
        language: script
        pass_filenames: false
      - id: no-print-check
        name: No direct print() in runtime scripts
        entry: bash scripts/pre-commit-hook.sh
        language: script
        pass_filenames: false
